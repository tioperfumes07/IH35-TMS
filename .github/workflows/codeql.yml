name: CodeQL Security Scan

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# GitHub's native SAST (static application security testing). Scans the WHOLE TS/JS codebase for
# security vulnerabilities (injection, auth flaws, unsafe data flow, secrets-in-code) — retroactively
# on the existing code AND on every PR. Findings surface in the repo's Security tab.
on:
  push:
    branches: [main]
  # Skip on PRs that touch no code (docs/trackers/block-ready/markdown). Push-to-main
  # and the weekly full scan still cover everything; only redundant PR runs are trimmed.
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".block-ready/**"
      - ".cursor/**"
      - "**/*.md"
  schedule:
    - cron: '0 7 * * 1' # weekly full scan, Mondays 07:00 UTC

jobs:
  analyze:
    name: CodeQL Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: ${{ matrix.language }}
          # security-extended adds deeper security queries beyond the default set.
          queries: security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: '/language:${{ matrix.language }}'
