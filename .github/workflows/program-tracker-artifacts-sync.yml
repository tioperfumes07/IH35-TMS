name: program-tracker-artifacts-sync

# Scheduled + on-merge REFRESH of the Program Tracker's committed artifacts (NON-FINANCIAL, reporting only):
#   • docs/trackers/block-reconciliation-data.json  — per-block status / PR / real timestamps (reconcile:blocks)
#   • docs/trackers/program-phase-manifest.json      — authored MASTER-6 phase map + authored-registered flags
#
# WHY this exists (Doc-19-A, 2026-07-11): previously these two artifacts only moved when a human ran
# `npm run reconcile:blocks` + the manifest generator by hand and committed the output — so the tracker's
# per-block STATUS froze for days. This job runs both in CI and auto-commits the refreshed JSON.
#
# NOTE ON THE HEADLINE "Registered" COUNT: it is NOT produced here. The backend counts ALL .block-ready blocks
# LIVE at request time (registry.size), so a newly-registered block bumps the headline on the next deploy with no
# script run. This job only refreshes the DERIVED per-block status/phase rollup ("as of last sync" on the page).
#
# DEPLOY COST: every commit to `main` is a prod deploy (§1.1). That is why:
#   • the schedule is modest (every 6h, NOT the board-sync 20-min cadence), and
#   • the push trigger fires ONLY on block-SOURCE paths (.block-ready/**, docs/blocks/**), never on the output
#     artifacts under docs/trackers/** — so the landed refresh can never re-trigger this workflow (no loop).
#
# HISTORICAL NOTE (corrected 2026-07-20): this job used to auto-commit with a skip-CI directive and push
# straight to `main`. That could NEVER land — a direct push cannot satisfy the 4 required status checks, and
# the skip directive guaranteed they never ran (GH013, every run). It now lands via PR; see the detailed
# rationale on the landing steps below.
# The separate program-board-sync.yml stays commit-free (writes to R2); this workflow is the ONLY committer,
# and it commits ONLY the two tracker JSON artifacts.

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  push:
    branches: [main]
    paths:
      - ".block-ready/**"
      - "docs/blocks/**"
      - "db/migrations/.held-migrations.json"
  workflow_dispatch: {}

# Only one refresh in flight; a newer run supersedes a queued one.
concurrency:
  group: program-tracker-artifacts-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main (full history for git ls-tree origin/main)
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Reconcile block status (reads origin/main + merged PRs via gh)
        env:
          # reconcile-block-status.mjs runs `gh pr list` for merged-PR signals; degrades gracefully if absent.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run reconcile:blocks

      - name: Regenerate authored phase manifest (refreshes registered flags from live .block-ready)
        # No MASTER-6 path in CI → generator preserves the prior authored lists and refreshes only the
        # `registered` flags from the live .block-ready set (documented fallback in the generator).
        run: node scripts/gen-program-phase-manifest.mjs

      # ----------------------------------------------------------------------
      # PR-BASED LANDING (2026-07-20 root-cause fix — replaces direct push to main)
      #
      # WHY THE OLD DIRECT PUSH COULD NEVER LAND:
      #   `hold-merge-gate` (ruleset 17935054) requires 4 status checks on main.
      #   A DIRECT push must already have those checks passing on the pushed
      #   commit — impossible for a brand-new commit — and the bot additionally
      #   marked its commit with a skip-CI directive, guaranteeing they never
      #   ran. Result: `GH013 ... 4 of 4 required status checks are expected`,
      #   push declined, EVERY run. The artifacts then aged past the 12h window
      #   and verify-tracker-artifacts-fresh went red repo-wide.
      #
      #   Removing the skip-CI directive alone does NOT fix it: a direct push
      #   cannot satisfy required checks either way. The unit of change on a
      #   protected branch has to be a PR.
      #
      # WHY NOT A RULESET BYPASS ACTOR:
      #   That is a permanent hole in the merge gate of a repo holding live
      #   financial data, for an automated pusher. Rejected by the owner and
      #   GUARD (2026-07-20). PR-based keeps every commit to main check-verified.
      #
      # ⚠ TOKEN REQUIREMENT — THIS IS LOAD-BEARING:
      #   Events created with the default GITHUB_TOKEN do NOT trigger workflow
      #   runs (GitHub's recursion guard). A PR opened with GITHUB_TOKEN would
      #   therefore get ZERO checks, the 4 required checks would never run, and
      #   auto-merge would never fire — reproducing the identical deadlock in a
      #   new shape, while LOOKING correct.
      #   So this job requires TRACKER_BOT_TOKEN (fine-grained PAT: contents RW +
      #   pull-requests RW on this repo). The preflight below FAILS LOUDLY when
      #   it is missing rather than silently degrading into that deadlock.
      # ----------------------------------------------------------------------
      - name: Preflight — require a PR-capable token (fail loudly, never deadlock silently)
        env:
          TRACKER_BOT_TOKEN: ${{ secrets.TRACKER_BOT_TOKEN }}
        run: |
          if [ -z "$TRACKER_BOT_TOKEN" ]; then
            echo "::error title=TRACKER_BOT_TOKEN missing::This workflow cannot land its refresh."
            echo "A PR opened with the default GITHUB_TOKEN does not trigger workflow runs, so the 4"
            echo "required status checks would never run and the PR could never merge."
            echo "FIX: create a fine-grained PAT (contents: read+write, pull-requests: read+write on"
            echo "this repo) and add it as the repository secret TRACKER_BOT_TOKEN."
            exit 1
          fi
          echo "TRACKER_BOT_TOKEN present — PR-based landing enabled."

      - name: Land the refreshed tracker artifacts via ONE reusable PR
        env:
          GH_TOKEN: ${{ secrets.TRACKER_BOT_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage ONLY the two tracker artifacts — never the dated .md / .xlsx side-outputs, never anything else.
          git add docs/trackers/block-reconciliation-data.json docs/trackers/program-phase-manifest.json
          if git diff --cached --quiet; then
            echo "[program-tracker-artifacts-sync] no changes — tracker artifacts already fresh"
            exit 0
          fi

          # FIXED branch name (NOT github.run_id) so every run FORCE-UPDATES one PR instead of opening a
          # new one each time. The old run-id scheme piled up a fresh PR every 6h; as main moved, each
          # went CONFLICTING (they all touch the same JSON), producing a growing wall of dead tracker PRs
          # (#3402/#3404/#3406/#3407/#3412/#3414/#3419 …). This checkout is on current main, so the branch
          # is always rebased — it can never be behind/CONFLICTING.
          BRANCH="chore/tracker-artifacts-sync"

          # NO skip-CI directive in this message, in ANY form — checks MUST run on this commit.
          # --no-verify: husky (from npm ci) refuses non-feature-branch/dirty states; CI is the gate.
          git commit --no-verify -m "chore(tracker): auto-refresh reconcile + phase-manifest artifacts"

          # Force the fixed branch to this commit (rebased on current main via the checkout above). The
          # PAT attribution is load-bearing: events from the default GITHUB_TOKEN don't trigger workflow
          # runs, so the required checks would never run and auto-merge would never fire.
          git push --no-verify --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$BRANCH"

          # Reuse the existing open PR for this fixed branch; the force-push above already refreshed its
          # diff. Create one only if none exists.
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "reused existing PR #$EXISTING (force-push refreshed its diff)"
            gh pr merge --auto --squash "$EXISTING" || true
          else
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(tracker): auto-refresh reconcile + phase-manifest artifacts" \
              --body "Automated refresh of the two committed Program Tracker artifacts (NON-FINANCIAL, reporting only) from \`npm run reconcile:blocks\` + \`node scripts/gen-program-phase-manifest.mjs\`.

          SINGLE REUSABLE PR: each 6h sync force-updates this one branch (always rebased on current main) instead of opening a new PR — so these can never accumulate or go CONFLICTING again. Auto-merge is armed and gated on the required checks; if they fail, the PR simply stays open and the next sync refreshes it.")
            echo "opened: $PR_URL"
            gh pr merge --auto --squash "$PR_URL"
          fi
          echo "auto-merge armed (squash, gated on required checks)"

          # Belt-and-suspenders cleanup: close any leftover run-id-based PRs from the OLD scheme so the
          # wall of stale tracker PRs drains itself instead of needing manual closes.
          for n in $(gh pr list --state open --json number,headRefName \
              --jq '.[] | select(.headRefName | test("tracker-artifacts-sync-[0-9]")) | .number'); do
            gh pr close "$n" --delete-branch \
              --comment "Superseded by the single reusable tracker-sync PR (fixed-branch scheme)." || true
          done
