name: PR Evidence Block (Rule 16)

# docs/specs/DEFINITION-OF-DONE.md §3 requires the evidence block in the PR BODY — the thing a
# reviewer reads and the thing that becomes the squash-merge message. Until this workflow existed
# that sentence had NO enforcement: verify-definition-of-done-evidence.mjs inspects commits over
# `merge-base..HEAD`, which is empty on main and never sees the PR body or the squash message.
#
# Runs on `edited` too, so fixing the body re-runs the check without a new push.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  evidence-block:
    name: PR body carries the Rule 16 evidence block
    runs-on: ubuntu-latest
    # Dependabot cannot satisfy this check and never will: it authors its own PR body from a template
    # and has no way to write a FINDING / ROOT CAUSE / LIVE PROOF block. Requiring one of it is a
    # PERMANENT red on every dependency bump — 8 such PRs were blocked on 2026-08-06 for a rule none
    # of them could ever pass. A check that a class of PR is structurally incapable of satisfying is
    # not a gate, it is noise, and noise is what trains reviewers to ignore red.
    #
    # Same precedent and same expression as semgrep.yml:34. This narrows the check's SCOPE; it does
    # not weaken it — every human- and agent-authored PR still must carry the block, which is the
    # population the rule was written for. Security review of dependency bumps is unaffected: the
    # CVE-delta gate in security-checks.yml still runs on dependabot and is the check that actually
    # matters there.
    if: (github.actor != 'dependabot[bot]')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Guard selftest (must be capable of failing)
        run: node scripts/check-pr-evidence-body.mjs --selftest

      - name: Collect PR body and changed files
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt
          # Three-dot (merge-base-aware) diff on purpose: two-dot compares the trees directly, so a
          # branch that has gone stale against a fast-moving main pulls in every intervening
          # main-only file too — wrongly tripping isAppAffecting() for PRs that never touched
          # apps/ or db/ themselves. Three-dot scopes the diff to what this branch actually changed.
          git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > /tmp/pr-files.txt || \
            git diff --name-only "origin/${{ github.event.pull_request.base.ref }}"...HEAD > /tmp/pr-files.txt
          echo "changed files: $(wc -l < /tmp/pr-files.txt)"

      - name: Check evidence block (PR body from the event payload)
        run: node scripts/check-pr-evidence-body.mjs --body-file /tmp/pr-body.txt --files-file /tmp/pr-files.txt
        # GITHUB_EVENT_PATH is set by Actions, so the script reads .pull_request.body directly and
        # prints which source it used; --body-file remains an explicit belt-and-braces fallback.
