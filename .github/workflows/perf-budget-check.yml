name: perf-budget-check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  # Bundle perf only changes with frontend/build inputs — skip on backend/docs-only PRs.
  # A daily scheduled run still covers drift regardless of path filters.
  pull_request:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/perf-budget-check.yml"
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/perf-budget-check.yml"
  schedule:
    - cron: "0 7 * * *"

jobs:
  perf-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend bundles (size snapshot)
        run: npm run build:frontend

      - name: Build driver PWA bundles (size snapshot)
        run: npm run build:driver-pwa

      - name: Bundle size snapshot
        run: node scripts/perf-bundle-size-snapshot.mjs

      - name: API latency baseline (informational)
        run: node scripts/perf-api-latency-baseline.mjs

      - name: Lighthouse baseline doc (committed metrics)
        run: node scripts/perf-lighthouse-on-prod.mjs

      - name: CI guard — perf budgets not regressed
        run: node scripts/verify-perf-budgets-not-regressed.mjs

      - name: Response-time middleware unit tests
        run: npx vitest run apps/backend/src/middleware/response-time.test.ts --config apps/backend/vitest.config.ts
