name: program-tracker-sync
# Auto-refresh the Program Tracker numbers (Sequence / By-Module / Pending / In-Progress / Done).
#
# WHY THIS EXISTS: the tracker endpoint (GET /api/v1/program/tracker) serves per-block status from the
# committed artifact docs/trackers/block-reconciliation-data.json. That artifact is produced by
# `npm run reconcile:blocks`, which calls `git ls-tree origin/main` + `gh pr list --state merged` —
# tools the prod backend does NOT have (no git, no gh, no .git). So the numbers can only be regenerated
# where git+gh exist = CI. Without this job the artifact only updates when a human manually runs
# reconcile:blocks and commits — so it froze (numbers stale by a day). This is the
# "program-tracker-artifacts-sync" the service comments referenced but that was never wired.
#
# WHAT IT DOES: on a schedule (and on demand), regenerate the artifact, and commit+push ONLY when the
# block COUNTS actually changed (ignoring the always-changing generated_at timestamp) — so it does not
# spam commits/deploys. The push to main triggers the normal deploy, and the tracker then serves the
# fresh numbers. Auto, no human step.
on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (offset :17 to avoid top-of-hour runner contention)
  workflow_dispatch: {}       # manual "refresh now" button

concurrency:
  group: program-tracker-sync
  cancel-in-progress: false

permissions:
  contents: write             # commit the regenerated artifact
  pull-requests: read         # `gh pr list` (merged-PR evidence)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # reconcile needs full history + origin/main for git ls-tree
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Capture pre-sync counts
        id: pre
        run: |
          if [ -f docs/trackers/block-reconciliation-data.json ]; then
            node -e "const c=require('./docs/trackers/block-reconciliation-data.json').counts||{};console.log(JSON.stringify(c))" > /tmp/pre-counts.json
          else
            echo "{}" > /tmp/pre-counts.json
          fi
          echo "counts=$(cat /tmp/pre-counts.json)" >> "$GITHUB_OUTPUT"
      - name: Regenerate reconciliation artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main --quiet
          npm run reconcile:blocks
      - name: Commit + push only if the block counts changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "const c=require('./docs/trackers/block-reconciliation-data.json').counts||{};console.log(JSON.stringify(c))" > /tmp/post-counts.json
          echo "pre : $(cat /tmp/pre-counts.json)"
          echo "post: $(cat /tmp/post-counts.json)"
          if [ "$(cat /tmp/pre-counts.json)" = "$(cat /tmp/post-counts.json)" ]; then
            echo "Counts unchanged — nothing to commit (no deploy churn)."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage ONLY the tracker artifacts (never a blind add — repo has untracked worktrees).
          git add docs/trackers/block-reconciliation-data.json \
                  docs/trackers/BLOCK-RECONCILIATION-*.md \
                  docs/trackers/exports/IH35-TMS-BLOCK-RECONCILIATION-*.xlsx 2>/dev/null || true
          git add docs/trackers/block-reconciliation-data.json
          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi
          git commit -m "chore(tracker): auto-sync block reconciliation (counts changed)

Regenerated by program-tracker-sync (scheduled). Numbers now reflect current
merged/registered/held block state. [auto]"
          git push origin HEAD:main
          echo "Pushed refreshed tracker artifact to main."
