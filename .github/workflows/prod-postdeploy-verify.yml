name: Production Post-Deploy Verify

# LAYER 2 — replaces the old "Canary Smoke Tests". Runs on push to main, WAITS
# for Render's production auto-deploy of THIS commit to go live (polls the API,
# no blind sleep), then smokes PRODUCTION on the correct paths. On failure it
# ALERTS — it does not pretend to gate a deploy that already happened. It never
# triggers its own prod deploy (Render auto-deploy already owns that).

on:
  push:
    branches: [main]

concurrency:
  group: prod-postdeploy-verify-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prod-postdeploy-verify:
    name: Production Post-Deploy Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 — the superseded check below needs real history to ask
      # "is THIS commit an ancestor of what is live?". With a shallow clone
      # `git merge-base --is-ancestor` cannot answer and the check is worthless.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Wait for Render production deploy of this commit to be live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PROD_SERVICE_ID: ${{ secrets.RENDER_PRODUCTION_SERVICE_ID }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          DEADLINE=$(( $(date +%s) + 600 ))   # up to 10 min for build+deploy
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            DEPLOYS=$(curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${PROD_SERVICE_ID}/deploys?limit=10")
            LIVE=$(printf '%s' "$DEPLOYS" | jq -r --arg sha "$SHA" \
              '[.[] | select(.deploy.commit.id == $sha and .deploy.status == "live")] | .[0].deploy.id // empty')
            if [ -n "$LIVE" ]; then
              echo "Production deploy ${LIVE} for ${SHA} is live."
              exit 0
            fi
            # A commit is genuinely SUPERSEDED only if what is live is a DESCENDANT of it.
            #
            # BUG THIS REPLACES (observed 2026-07-22): this block took "the most recent live
            # deploy's commit", named it NEWER, and treated `!= $SHA` as proof of supersession —
            # with no ancestry comparison at all. Before a fresh deploy finishes, the live commit
            # is ALWAYS different from the just-merged SHA, so this fired on the FIRST loop
            # iteration of every run and exited 0. The wait loop and the timeout branch below were
            # unreachable. The gate reported "Production Post-Deploy Verify: success" for merges
            # that never deployed — main sat 3 commits ahead of prod for 4+ hours (prod 3cac24f
            # vs main 8d5a50c6e) while this check was green, and it logged the older commit as
            # "a newer commit … was superseded".
            LIVE_COMMIT=$(printf '%s' "$DEPLOYS" | jq -r '[.[] | select(.deploy.status == "live")] | .[0].deploy.commit.id // empty')
            if [ -n "$LIVE_COMMIT" ] && [ "$LIVE_COMMIT" != "$SHA" ]; then
              if git merge-base --is-ancestor "$SHA" "$LIVE_COMMIT" 2>/dev/null; then
                echo "Live prod commit ${LIVE_COMMIT} is a descendant of ${SHA}; this commit was genuinely superseded. Verifying current prod."
                exit 0
              fi
              echo "Live prod commit ${LIVE_COMMIT} is NOT a descendant of ${SHA} — prod is BEHIND this merge. Still waiting."
            fi
            echo "prod deploy of ${SHA} not live yet; waiting 20s…"
            sleep 20
          done
          # Timeout is a FAILURE, not a warning. "Merged" is not "live", and a gate whose entire
          # job is proving the deploy landed must not pass when it did not.
          echo "::error::No live prod deploy for ${SHA} within the window, and nothing newer is live either — the merge did NOT reach production."
          echo "Check the Render service for a failed/stuck deploy (preDeployCommand runs db:migrate first, so a failing pre-deploy blocks every later deploy silently)."
          exit 1

      - name: Smoke PRODUCTION
        id: smoke
        continue-on-error: true
        env:
          BASE_URL: https://api.ih35dispatch.com
        run: bash scripts/smoke.sh

      - name: Alert on failure (do NOT auto-rollback)
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "::error::Production post-deploy smoke FAILED for ${{ github.sha }}."
          echo "Prod auto-deploy already shipped this commit. Investigate immediately."
          echo "Rollback is a human decision: Render dashboard → redeploy the last known-good commit."
          # Optional: wire a Slack/email/Sentry notification here using a secret webhook.
          exit 1
