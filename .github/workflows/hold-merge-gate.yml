# HOLD-MERGE-GATE — classifies financial/HOLD PRs; FAILS only if a held migration is introduced
# without the db-migrate prod firewall. OWNER 2026-07-26: JORGE-APPROVED label is NO LONGER required
# (questions answered at block invent — docs/specs/PRE-BLOCK-OWNER-QUESTIONS-LAW-2026-07-26.md).
name: hold-merge-gate

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

# labeled/unlabeled kept for legacy; label no longer required to pass.
permissions:
  contents: read

jobs:
  hold-merge-gate:
    runs-on: [self-hosted, mac]
    steps:
      - name: Checkout (full history for the base..head diff)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run HOLD-merge gate
        env:
          GATE_PR_TITLE: ${{ github.event.pull_request.title }}
          GATE_PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/verify-hold-merge-gate.mjs
