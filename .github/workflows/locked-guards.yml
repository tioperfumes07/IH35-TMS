  # Thin aggregator — required context `locked-guards / locked-guards` always reports.
  locked-guards:
    name: locked-guards
    needs: [detect-scope, locked-guards-heavy]
    if: always() && needs.detect-scope.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate required check
        run: |
          DOC="${{ needs.detect-scope.outputs.doc_only }}"
          HEAVY="${{ needs.locked-guards-heavy.result }}"
          echo "doc_only=$DOC heavy=$HEAVY"
          if [ "$DOC" = "true" ]; then
            echo "DOC-ONLY — locked-guards heavy suspended (owner 2026-08-31)."
            exit 0
          fi
          if [ "$HEAVY" = "success" ]; then
            exit 0
          fi
          echo "Heavy locked-guards did not succeed: $HEAVY"
          exit 1

