name: locked-guards

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# CI-COVERAGE FIX (2026-07-23): NO `branches:` filter on purpose. `branches: [main]`
# meant a stacked PR (base = another feature branch) skipped every static guard in
# this file — the cheapest and highest-signal gate in the repo. Evidence: PR #3298
# ran only hold-merge-gate + pass-7. Every step here is a whole-tree static check
# with no dependency on github.base_ref, so it is correct on any base.
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  detect-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      doc_only: ${{ steps.scope.outputs.doc_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect doc-only PR
        id: scope
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-detect-doc-only.mjs


  locked-guards-heavy:
    name: locked-guards-heavy
    needs: detect-scope
    if: needs.detect-scope.outputs.doc_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # LOAD-BEARING: verify:block-acceptance and verify:block-registry-complete both do a
          # forward-only `git diff origin/main...HEAD -- .block-ready/`. On the actions/checkout
          # default (depth 1) origin/main does not exist, the diff comes back empty, and both
          # "forward completeness" checks pass having examined zero entries. Same empty-input-is-not-
          # success class as verify-step 1430. Do not remove.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      - name: verify:deep-audit-b-invoices-subnav
        run: npm run verify:deep-audit-b-invoices-subnav
      - name: verify:planner-load-templates --selftest
        run: node scripts/verify-planner-load-templates.mjs --selftest
      - name: verify:planner-load-templates
        run: npm run verify:planner-load-templates
      - name: verify:dispatch-notify-prefs-onerror --selftest
        run: node scripts/verify-dispatch-notify-prefs-onerror.mjs --selftest
      - name: verify:dispatch-notify-prefs-onerror
        run: npm run verify:dispatch-notify-prefs-onerror
      - name: verify:damage-continuity-worker-mounted --selftest
