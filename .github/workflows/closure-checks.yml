name: closure-checks

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".block-ready/**"
      - ".cursor/**"
      - "claude/**"
      - "**/*.md"
  push:
    branches: [main]

jobs:
  lucia-bypass-guard-pattern:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify luciaBypass guard pattern
        run: node scripts/verify-lucia-bypass-guard-pattern.mjs

  driver-bypass-pk-opco-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify bypass driver PII reads are OCI-scoped (C2-4)
        run: node scripts/verify-driver-bypass-pk-opco-scope.mjs

  drivers-rls-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify mdata.drivers SELECT policy is OCI-scoped (H1)
        run: node scripts/verify-drivers-rls-scope.mjs

  phantom-relation-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify backend SQL references no phantom (non-existent) relation
        run: node scripts/verify-phantom-relations.mjs

  no-iso-date-display:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Guard self-test
        run: node scripts/verify-no-iso-date-display.mjs --selftest

      - name: Verify no raw YYYY-MM-DD date leaks in user-facing frontend text (SYS-DATE)
        run: node scripts/verify-no-iso-date-display.mjs

  program-board-tab-render-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Guard self-test (negative + positive)
        run: node scripts/verify-program-board-tab-render-parity.mjs --selftest

      - name: Verify every Program Board shared-table tab renders (no blank Audit/extra-track tab)
        run: node scripts/verify-program-board-tab-render-parity.mjs

  program-board-no-autocommit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Guard self-test (negative + positive)
        run: node scripts/verify-program-board-no-autocommit.mjs --selftest

      - name: Verify program-board-sync refreshes live via R2 (no auto-commit prod-deploy storm)
        run: node scripts/verify-program-board-no-autocommit.mjs

  no-archived-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Guard self-test (negative + positive)
        run: node scripts/verify-no-archived-imports.mjs --selftest

      - name: Verify no live frontend file imports from _archived/ (C1-4 dead-component archive lock)
        run: node scripts/verify-no-archived-imports.mjs

  money-dispatch-opco-resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Guard self-test (negative + positive)
        run: node scripts/verify-money-dispatch-opco-resolver.mjs --selftest

      - name: Verify money/dispatch routes validate operating_company_id via membership resolver (G2-2)
        run: node scripts/verify-money-dispatch-opco-resolver.mjs
